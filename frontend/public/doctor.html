<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, Helvetica, sans-serif;
            background: url('/booking.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero {
            background: rgba(255,255,255,0.9);
            padding: 24px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body id="doctor-page">
    <div class="hero">
        <h1>DOCTOR PORTAL</h1>
        <box-icon name='user' type='solid' color='#1976d2' size='100px'></box-icon>
        <p>Welcome to the doctor portal. Here you can manage your appointments, view your medical records, and communicate with your patients.</p>
        <form>
            <div style="margin-bottom: 16px;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br> 
            </div>
            <div style="margin-bottom: 16px;">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br>
            </div>
            <div class="btn-group">
                <button type="submit">Login</button>
            </div>

            <div style="margin-top: 16px;">
                <p>Don't have an account? <a href="register.html">Register here</a>.</p>
            </div>

            <div style="margin-top: 16px;">
                <p>Forgot your password? <a href="forgot_password.html">Reset it here</a>.</p>
            </div>
            <div class="btn-group" style="margin-top: 16px;">
                <button type="button" onclick="window.location.href='front.html'">Back</button>
            </div>
        </form>
    </div>
    <script src="/app.js"></script>
</body>
</html>
