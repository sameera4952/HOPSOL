<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #eef5ef;
            color: #254b38;
            font-family: 'Trebuchet MS', sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
        }
        .profile-card {
            background: #ffffff;
            border: 1px solid #d5e5d8;
            border-radius: 10px;
            margin: 0 auto;
            max-width: 620px;
            padding: 28px;
        }
        h1 { margin-top: 0; }
        .profile-data { display: grid; gap: 14px; margin: 24px 0; }
        .profile-row {
            background: #f4faf5;
            border: 1px solid #d5e5d8;
            border-radius: 5px;
            display: grid;
            gap: 4px;
            padding: 12px;
        }
        .profile-row strong {
            color: #587061;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .profile-row span { font-size: 1rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .actions a {
            background: #34745f;
            border-radius: 5px;
            color: #ffffff;
            padding: 10px 14px;
            text-decoration: none;
        }
        .actions a.secondary { background: #dfeee3; color: #254b38; }
    </style>
</head>
<body id="profile-page">
    <main class="profile-card">
        <h1 id="profile-heading">Profile</h1>
        <p id="profile-description">Your account information.</p>
        <section class="profile-data" id="profile-data" aria-live="polite"></section>
        <div class="actions">
            <a id="dashboard-link" href="login.html">Dashboard</a>
            <a class="secondary" href="front.html">Home</a>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
