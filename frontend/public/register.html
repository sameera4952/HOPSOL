<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CREATE AN ACCOUNT</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, Helvetica, sans-serif;
            background: url('/images/booking.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero {
            background: rgba(255,255,255,0.9);
            padding: 24px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        input {
            padding: 10px;
            margin-left: 10px;
        }
    </style>
</head>

<body id="register-page">

    <div class="hero">

        <h1>CREATE AN ACCOUNT</h1>

        <form>

            <!-- NAME -->
            <div style="margin-bottom: 16px;">
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <!-- EMAIL -->
            <div style="margin-bottom: 16px;">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <!-- PASSWORD -->
            <div style="margin-bottom: 16px;">
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <!-- PHONE NUMBER -->
            <div style="margin-bottom: 16px;">
                <label for="phone">Phone:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    placeholder="10-digit number"
                    required
                >
            </div>

            <!-- REGISTER -->
            <div class="btn-group">
                <button type="submit">Register</button>
            </div>

            <!-- BACK -->
            <div class="btn-group" style="margin-top: 16px;">
                <button
                    type="button"
                    onclick="window.location.href='front.html'"
                >
                    Back
                </button>
            </div>

        </form>

    </div>

    <script src="/app.js"></script>

</body>
</html>
