<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPOINTMENT BOOKING</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: url('/booking.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero {
            background: rgba(255,255,255,0.9);
            padding: 24px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-group button {
            padding: 10px 18px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1976d2;
            color: #fff;
        }

        .btn-group button.secondary {
            background: #4caf50;
        }

        @media (max-width: 420px) {
            h1 { font-size: 1.2rem; }
            .btn-group { flex-direction: column; }
            .btn-group button { width: 100%; }
        }
    </style>
</head>
<body id="front-page">
    <div class="hero">
        <h1>APPOINTMENT BOOKING</h1>
        <div class="btn-group">
            <button id="patientBtn">Patient</button>
            <button id="doctorBtn" class="secondary">Doctor</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
